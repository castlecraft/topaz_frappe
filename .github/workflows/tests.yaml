name: CI

on:
  push:
    branches:
      - version-16
  pull_request:
    branches:
      - version-16
  workflow_dispatch:

concurrency:
  group: ci-topaz-frappe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server Tests
    runs-on: ubuntu-latest
    container:
      image: frappe/bench:latest

    services:
      redis-cache:
        image: redis:alpine
      redis-queue:
        image: redis:alpine
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: 123
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci

    steps:
      - name: Checkout topaz_frappe
        uses: actions/checkout@v4
        with:
          path: /workspace/frappe-bench/apps/topaz_frappe

      - name: Setup Bench Site & Run Tests
        working-directory: /workspace/frappe-bench
        run: |
          # Initialize site config pointing to CI service containers
          bench set-config -g db_host mariadb
          bench set-config -g redis_cache redis://redis-cache:6379
          bench set-config -g redis_queue redis://redis-queue:6379
          bench set-config -g root_login root
          bench set-config -g root_password 123
          bench set-config -g admin_password admin

          # Install topaz_frappe dependencies into bench env
          ./env/bin/pip install -e apps/topaz_frappe

          # Create fresh test site
          bench new-site test_site \
            --db-type mariadb \
            --db-host mariadb \
            --db-root-username root \
            --db-root-password 123 \
            --admin-password admin \
            --no-mariadb-socket

          # Install app and run test suite
          bench --site test_site install-app topaz_frappe
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app topaz_frappe
