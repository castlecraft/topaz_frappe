name: CI

on:
  push:
    branches:
      - version-16
  pull_request:
    branches:
      - version-16
  workflow_dispatch:

concurrency:
  group: ci-topaz-frappe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server Tests
    runs-on: ubuntu-latest

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout topaz_frappe
        uses: actions/checkout@v4
        with:
          path: frappe-bench/apps/topaz_frappe

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install MariaDB Client
        run: sudo apt-get install -y mariadb-client

      - name: Setup Frappe Bench
        run: |
          pip install frappe-bench
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(which python)" \
            --version version-16 \
            frappe-bench

      - name: Configure Database & Site
        working-directory: frappe-bench
        run: |
          cat << 'EOF' > ~/.my.cnf
          [client]
          ssl=0
          ssl-verify-server-cert=0
          EOF

          mariadb --host 127.0.0.1 -u root -proot --ssl=0 -e "SET GLOBAL character_set_server = 'utf8mb4';"
          mariadb --host 127.0.0.1 -u root -proot --ssl=0 -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app topaz_frappe

      - name: Run Tests
        working-directory: frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app topaz_frappe
