name: CI

on:
  push:
    branches:
      - version-16
  pull_request:
    branches:
      - version-16
  workflow_dispatch:

concurrency:
  group: ci-topaz-frappe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Full Server Tests
    runs-on: ubuntu-latest

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout topaz_frappe
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python 3.14 via uv
        run: |
          uv python install 3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mariadb-client cron libcups2-dev git curl
          npm install -g yarn

      - name: Setup Frappe Bench
        run: |
          uv tool install frappe-bench
          bench init \
            --skip-redis-config-generation \
            --skip-assets \
            --python "$(uv python find 3.14)" \
            --version version-16 \
            ~/frappe-bench

      - name: Configure Site & Run Full Tests
        working-directory: /home/runner/frappe-bench
        run: |
          cat << 'EOF' > ~/.my.cnf
          [client]
          ssl=0
          ssl-verify-server-cert=0
          EOF

          mariadb --host 127.0.0.1 -u root -proot --ssl=0 -e "SET GLOBAL character_set_server = 'utf8mb4';"
          mariadb --host 127.0.0.1 -u root -proot --ssl=0 -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

          bench get-app topaz_frappe "$GITHUB_WORKSPACE"
          bench setup requirements --dev

          bench set-config -g root_login "root"
          bench set-config -g root_password "root"
          bench set-config -g admin_password admin

          bench new-site test_site \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-root-username root \
            --db-root-password root \
            --admin-password admin \
            --no-mariadb-socket

          bench --site test_site install-app topaz_frappe
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app topaz_frappe
